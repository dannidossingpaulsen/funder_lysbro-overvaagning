name: Undersoeg Silkeborg moedeindhold API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  undersoeg-moedeindhold:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer requests
        run: pip install requests
      - name: Test om et moede-ID giver adgang til dagsordenspunkter
        run: |
          python - <<'PY'
          import json
          import requests
          from urllib.parse import quote

          root = 'https://dagsordener.silkeborg.dk'
          session = requests.Session()
          session.headers.update({'Accept': 'application/json', 'User-Agent': 'Funder-Lysbro-API-diagnose/1.0'})
          r = session.get(root + '/api/agenda/udvalgsliste', timeout=25)
          print('Udvalgsliste HTTP:', r.status_code, flush=True)
          r.raise_for_status()
          data = r.json()
          udvalg = [u for gruppe in data['Udvalg'].values() for u in gruppe if isinstance(u, dict)]
          kandidat = next((u for u in udvalg if u.get('Navn') == 'Byrådet' and u.get('Moeder')), None)
          if not kandidat:
              raise SystemExit('Ingen byrådsmøder i API-svaret. Intet ændret.')
          moede = kandidat['Moeder'][0]
          mid = moede['Id']
          uid = kandidat['Id']
          print('Testmøde:', kandidat['Navn'], 'dato:', moede.get('Dato'), 'møde-ID:', mid, flush=True)
          print('Mødeobjektets felter:', list(moede), flush=True)
          print('OBS: Nedenstående er kun en begrænset test af mulige API-adresser, ikke dokumenterede endpoints.', flush=True)

          paths = [
              f'/api/agenda/moede/{quote(str(mid))}',
              f'/api/agenda/moede?id={quote(str(mid))}',
              f'/api/agenda/meeting/{quote(str(mid))}',
              f'/api/agenda/meeting?id={quote(str(mid))}',
              f'/api/agenda/vis?id={quote(str(mid))}',
              f'/api/agenda/dagsorden?id={quote(str(mid))}',
              f'/api/agenda/dagsorden/{quote(str(mid))}',
          ]
          for path in paths:
              try:
                  response = session.get(root + path, timeout=15, allow_redirects=False)
                  content_type = response.headers.get('Content-Type', '')
                  print('\nENDPOINT:', path, 'HTTP:', response.status_code, 'type:', content_type, 'bytes:', len(response.content), flush=True)
                  if response.status_code == 200 and 'json' in content_type.lower():
                      try:
                          payload = response.json()
                          if isinstance(payload, dict):
                              print('JSON felter:', list(payload)[:35], flush=True)
                          elif isinstance(payload, list):
                              print('JSON liste: antal', len(payload), 'første elements felter:', list(payload[0])[:25] if payload and isinstance(payload[0], dict) else '-', flush=True)
                          print('JSON uddrag:', json.dumps(payload, ensure_ascii=False, default=str)[:900], flush=True)
                      except ValueError:
                          print('Kunne ikke fortolke JSON', flush=True)
                  else:
                      print('Svaruddrag:', response.text[:180].replace('\n', ' '), flush=True)
              except requests.RequestException as exc:
                  print('Netværksfejl:', type(exc).__name__, str(exc)[:160], flush=True)
          print('\nTest afsluttet. Ingen filer, historik eller hjemmeside er ændret.', flush=True)
          PY
